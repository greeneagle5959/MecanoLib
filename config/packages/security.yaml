security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "argon2i"
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }
        users_in_database:
            entity:
                class: App\Entity\Utilisateur
                property: emailUtilisateur
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
      

        api:
            pattern: ^/api
            stateless: true
            provider: users_in_database
            jwt: ~

        main:
            lazy: true
            provider: users_in_memory

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:

         # ---------------- ROUTES PUBLIQUES ----------------
        - { path: ^/api/v1/users/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/users/inscrire_client, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/users/inscrire-garage, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/users/forget_password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/users/reset_password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/check_siret_insee, roles: PUBLIC_ACCESS }
        # ----- -----  ROUTES SUPER ADMIN ----------
        - { path: ^/api/v1/users/ajouter_superadmin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/v1/users/get_utilisateur, roles: ROLE_SUPER_ADMIN }

        # --------------- ROUTES UTILISATEUR CONNECTÉ ----------
        - { path: ^/api/v1/users/activer_2fa, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/users/verify_2fa, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/users/desactiver_2fa, roles: IS_AUTHENTICATED_FULLY }
        #- { path: ^/api/v1/users/connecter, roles: IS_AUTHENTICATED_FULLY }

        # -------------- PROTECTION GLOBALE API ----------
        #- { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2i
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
